name: CI

# Chạy trên mỗi PR + push lên main: build + toàn bộ test (unit + integration).
# Integration tests dùng Testcontainers → cần Docker runtime (ubuntu-latest có sẵn).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-test:
    name: Backend (Maven) — unit + integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Quan trọng: integration tests (auth/playlist/track DataJpaTest + search ES)
      # cần Docker để khởi chạy Testcontainers containers.
      - name: Build & test toàn bộ backend
        run: ./mvnw test
        working-directory: backend

  frontend-test:
    name: Frontend — lint + typecheck + unit test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test
